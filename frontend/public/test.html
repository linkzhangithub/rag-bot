<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Bot - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .status {
            margin: 20px;
            padding: 20px;
            border-radius: 8px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🚀 RAG Bot 测试页面</h1>
    
    <div id="backend-status" class="status">
        正在检查后端状态...
    </div>
    
    <div id="frontend-status" class="status">
        前端正常运行 ✅
    </div>

    <script>
        // 检查后端状态
        fetch('/health')
            .then(response => response.json())
            .then(data => {
                const statusDiv = document.getElementById('backend-status');
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `
                        <h3>✅ 后端已连接</h3>
                        <p>状态: ${data.status}</p>
                        <p>文档数量: ${data.documentCount}</p>
                    `;
                } else {
                    throw new Error('Backend not ready');
                }
            })
            .catch(error => {
                const statusDiv = document.getElementById('backend-status');
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <h3>❌ 后端连接失败</h3>
                    <p>${error.message}</p>
                `;
            });
    </script>
</body>
</html>
