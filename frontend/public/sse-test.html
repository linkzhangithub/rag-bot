<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        #output {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 200px;
            margin-top: 20px;
            white-space: pre-wrap;
            background: #f5f5f5;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>SSE 流式测试</h1>
    <button onclick="testSSE()">测试 SSE</button>
    <div id="status"></div>
    <h3>输出：</h3>
    <div id="output"></div>

    <script>
        async function testSSE() {
            const output = document.getElementById('output');
            const status = document.getElementById('status');
            output.textContent = '';
            status.className = 'status';
            status.textContent = '正在连接...';

            try {
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        question: '你好，请介绍一下自己',
                        sessionId: 'test_' + Date.now()
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                status.className = 'status success';
                status.textContent = '连接成功，接收数据中...';

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) {
                        status.textContent = '完成';
                        break;
                    }

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        
                        if (!trimmedLine || trimmedLine.startsWith(':')) {
                            continue;
                        }
                        
                        if (trimmedLine.startsWith('data: ')) {
                            const data = trimmedLine.slice(6);
                            
                            if (data === '[DONE]') {
                                status.textContent = '完成';
                                return;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                
                                if (parsed.type === 'sources') {
                                    output.textContent += '\n[来源信息]\n';
                                    output.textContent += JSON.stringify(parsed.sources, null, 2) + '\n\n';
                                } else if (parsed.content) {
                                    output.textContent += parsed.content;
                                } else if (parsed.error) {
                                    throw new Error(parsed.error);
                                }
                            } catch (e) {
                                console.warn('解析失败:', e, '原始数据:', data);
                            }
                        }
                    }
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = '错误: ' + error.message;
                console.error('SSE 错误:', error);
            }
        }
    </script>
</body>
</html>
